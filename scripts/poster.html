<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" />
  <title>潮线夜驶封面渲染</title>
  <style>
    body {
      margin: 0;
      background: #150d22;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
  <canvas></canvas>
  <script type="module">
    import * as T from 'three';
    import { loadModels, makeCity, personModel, vehicleModel } from '../src/world.js';

    await loadModels();
    const canvas = document.querySelector('canvas');
    const renderer = new T.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
    renderer.toneMapping = T.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    if (new URLSearchParams(location.search).has('garage')) {
      renderer.setSize(900, 190, false);
      renderer.setScissorTest(true);
      const preview = new T.Scene();
      preview.background = new T.Color(0x211531);
      preview.add(new T.HemisphereLight(0xffd5ef, 0x493053, 2.5));
      const sun = new T.DirectionalLight(0xffc4a7, 2.25);
      sun.position.set(4, 8, -5);
      preview.add(sun);
      const camera = new T.PerspectiveCamera(35, 300 / 190, 0.1, 50);
      camera.position.set(5.1, 2.8, -6.7);
      camera.lookAt(0, 0.75, 0);
      for (const [index, [model, color]] of [
        ['sedan', '#b6e4fa'],
        ['van', '#f2ae67'],
        ['coupe', '#e568ac'],
      ].entries()) {
        const car = vehicleModel(model, color).group;
        preview.add(car);
        renderer.setViewport(index * 300, 0, 300, 190);
        renderer.setScissor(index * 300, 0, 300, 190);
        renderer.render(preview, camera);
        preview.remove(car);
      }
      document.body.dataset.ready = 'true';
    } else {
      renderer.setSize(1440, 840, false);
      const scene = new T.Scene();
      makeCity(scene);
      scene.fog.density = 0.0031;
      const car = vehicleModel('coupe', '#f99cff').group;
      car.position.set(-152.8, 0.05, 4.25);
      car.rotation.y = -1.94;
      scene.add(car);
      const traveler = personModel(0xec71af, 0).group;
      traveler.position.set(-150.72, 0.03, 2.92);
      traveler.rotation.y = -2.49;
      scene.add(traveler);

      const gloss = new T.Mesh(
        new T.PlaneGeometry(15, 23),
        new T.MeshBasicMaterial({
          color: 0xf59ebd,
          transparent: true,
          opacity: 0.07,
          depthWrite: false,
        }),
      );
      gloss.rotation.x = -Math.PI / 2;
      gloss.position.set(-151, 0.045, 3);
      scene.add(gloss);

      const buildingMat = new T.MeshBasicMaterial({ color: 0x51335e });
      for (let i = 0; i < 26; i++) {
        const height = 8 + 31 * (0.5 + 0.5 * Math.sin(i * 4.2)) ** 2;
        const building = new T.Mesh(new T.BoxGeometry(5 + (i % 4), height, 6), buildingMat);
        building.position.set(-316 + i * 4.5, height / 2 - 2, -123 - i * 0.45);
        scene.add(building);
      }

      const camera = new T.PerspectiveCamera(49, 1440 / 840, 0.1, 510);
      camera.position.set(-145.8, 2.55, 11.85);
      camera.lookAt(-154.1, 2.68, -0.9);
      renderer.render(scene, camera);
      document.body.dataset.ready = 'true';
    }
  </script>
</html>
