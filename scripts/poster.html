<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" />
  <title>S城风云封面渲染</title>
  <style>
    body {
      margin: 0;
      background: #150d22;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
  <canvas></canvas>
  <script type="module">
    import * as T from 'three';
    import { loadModels, makeCity, personModel, vehicleModel } from '../src/world.js';

    await loadModels();
    const canvas = document.querySelector('canvas');
    const renderer = new T.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
    renderer.toneMapping = T.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    if (new URLSearchParams(location.search).has('garage')) {
      renderer.setSize(900, 190, false);
      renderer.setScissorTest(true);
      const preview = new T.Scene();
      preview.background = new T.Color(0x211531);
      preview.add(new T.HemisphereLight(0xffd5ef, 0x493053, 2.5));
      const sun = new T.DirectionalLight(0xffc4a7, 2.25);
      sun.position.set(4, 8, -5);
      preview.add(sun);
      const camera = new T.PerspectiveCamera(35, 300 / 190, 0.1, 50);
      camera.position.set(5.1, 2.8, -6.7);
      camera.lookAt(0, 0.75, 0);
      for (const [index, [model, color]] of [
        ['sedan', '#b6e4fa'],
        ['van', '#f2ae67'],
        ['coupe', '#e568ac'],
      ].entries()) {
        const car = vehicleModel(model, color).group;
        preview.add(car);
        renderer.setViewport(index * 300, 0, 300, 190);
        renderer.setScissor(index * 300, 0, 300, 190);
        renderer.render(preview, camera);
        preview.remove(car);
      }
      document.body.dataset.ready = 'true';
    } else {
      renderer.setSize(1440, 840, false);
      const scene = new T.Scene();
      makeCity(scene);
      scene.fog.density = 0.002;
      const camera = new T.PerspectiveCamera(69, 1440 / 840, 0.1, 1600);
      camera.position.set(26, 55, 323);
      camera.lookAt(24, 17, 144);
      if (new URLSearchParams(location.search).has('lobby')) {
        const car = vehicleModel('coupe', '#aa7abe').group;
        car.position.set(25.5, 0.13, 151.6);
        car.rotation.y = Math.PI * 0.74;
        scene.add(car);
        for (const [x, z, color, yaw] of [
          [22.9, 151.4, 0xe9a164, 0.22],
          [27.1, 152.9, 0xce6b98, -0.23],
        ]) {
          const resident = personModel(color, 1).group;
          resident.position.set(x, 0.13, z);
          resident.rotation.y = yaw;
          scene.add(resident);
        }
        camera.position.set(24.7, 2.8, 143.5);
        camera.lookAt(26, 1.9, 155);
      }
      renderer.render(scene, camera);
      document.body.dataset.ready = 'true';
    }
  </script>
</html>
