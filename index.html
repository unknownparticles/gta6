<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="theme-color" content="#150c29" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-180.png" />
    <meta name="description" content="GTA6-S城风云，以内海湾和两岸地标为主题的开放城市游戏。" />
    <title>GTA6-S城风云</title>
    <script
      defer
      src="https://vibefriends.com/telemetry/v1.js"
      data-vc-product-id="cmwu1728c001h01ns7aumk3jz"
      data-vc-auth-key="vc_web_rt1IJJxTAmkcs45Ry03WXVyiRpyaceO9Ghng_gxSv9E"
    ></script>
  </head>
  <body>
    <main id="lobby" class="lobby">
      <header class="mast">
        <button class="passport" data-open="profile">
          <span class="avatar" aria-hidden="true"><i data-icon="user"></i></span>
          <span><b id="player-name">S城车手</b><small id="profile-label">登录 / 注册</small></span>
          <em id="vip">VIP 0</em>
        </button>
        <div class="resource-bar" aria-label="车手资源">
          <button class="balance" data-open="shop">
            <i data-icon="coin"></i><span>潮票<b id="coin-count">0</b></span
            ><strong>＋</strong>
          </button>
          <button class="balance" data-open="garage">
            <i data-icon="car"></i><span>涂装<b id="paint-count">1</b></span>
          </button>
          <button class="balance" data-open="pass">
            <i data-icon="ticket"></i><span>里程<b id="mile-count">0</b></span>
          </button>
          <button class="balance" data-open="armory">
            <i data-icon="bolt"></i><span>装备<b id="equip-count">0</b></span>
          </button>
        </div>
        <div class="top-actions">
          <button class="square" data-open="notice" aria-label="公告">
            <i data-icon="bell"></i><span>公告</span>
          </button>
          <button class="square" data-open="help" aria-label="帮助">
            <i data-icon="gamepad"></i><span>帮助</span>
          </button>
          <button class="square" data-open="settings" aria-label="设置">
            <i data-icon="settings"></i><span>设置</span>
          </button>
        </div>
      </header>
      <nav class="event-bar" aria-label="活动快捷入口">
        <button data-open="welfare"><i data-icon="gift"></i><span>福利中心</span></button>
        <button data-open="sign"><i data-icon="ticket"></i><span>每日签到</span></button>
        <button data-open="shop"><i data-icon="crown"></i><span>限时礼包</span></button>
        <button data-open="districts"><i data-icon="map"></i><span>游览S城</span></button>
        <button data-start="ferry"><i data-icon="ferry"></i><span>广礐轮渡</span></button>
        <button data-start="beach"><i data-icon="target"></i><span>沙滩赛事</span></button>
        <button data-start="race"><i data-icon="finish"></i><span>竞速</span></button>
        <button data-open="tasks"><i data-icon="flag"></i><span>任务中心</span></button>
        <button data-open="pass"><i data-icon="ticket"></i><span>通行证</span></button>
        <button data-open="shop"><i data-icon="bag"></i><span>商城</span></button>
      </nav>
      <nav class="rail" aria-label="车手服务">
        <button data-open="garage"><i data-icon="garage"></i><span>车库</span></button>
        <button data-start="gang"><i data-icon="police"></i><span>帮派</span></button>
        <button data-open="armory"><i data-icon="blaster"></i><span>武器</span></button>
        <button data-open="welfare"><i data-icon="gift"></i><span>福利</span></button>
        <button data-open="pass"><i data-icon="crown"></i><span>特权</span></button>
        <button data-open="shop"><i data-icon="coin"></i><span>礼包</span></button>
        <button data-open="profile"><i data-icon="user"></i><span>会员</span></button>
      </nav>
      <div class="hero-title">
        <p><span></span> S城 · 一湾两岸</p>
        <h1>GTA<span>6</span></h1>
        <div class="hero-subtitle"><strong>S城风云</strong><small>geitaai</small></div>
      </div>
      <aside class="promos" aria-label="福利与礼包">
        <button class="promo recharge" data-open="firstSix">
          <span class="ribbon">首充专享</span><span class="promo-art"><i data-icon="blaster"></i></span>
          <strong>首充 <em>6 元</em></strong
          ><small>金色涂装 · 潮票 · 补给券</small>
          <span class="promo-go">领取好礼</span>
        </button>
        <button class="promo sign" data-open="sign">
          <span class="ribbon">登录有礼</span><span class="promo-art"><i data-icon="car"></i></span>
          <strong>七日登录礼</strong><small>第七天领限定镀铬涂装</small>
          <span id="quick-days" class="quick-days" aria-hidden="true"></span>
        </button>
        <button class="promo pass" data-open="pass">
          <span class="ribbon">S1</span><strong>S城通行证</strong><small>累计里程解锁车手头衔</small
          ><i data-icon="ticket"></i>
        </button>
        <button class="promo member" data-open="membership">
          <span class="promo-art"><i data-icon="crown"></i></span><strong>豪华月卡</strong
          ><small>车手补给与会员权益</small><span class="promo-go">查看权益</span>
        </button>
        <section class="bundle" aria-label="限时礼包">
          <b>限时礼包 · 超值补给</b>
          <div>
            <button data-open="confirm-pack" data-id="0">
              <i data-icon="gift"></i><span>新手特惠</span><em>领取</em>
            </button>
            <button data-open="confirm-pack" data-id="1">
              <i data-icon="blaster"></i><span>街头补给</span><em>68 潮票</em>
            </button>
            <button data-open="confirm-pack" data-id="2">
              <i data-icon="crown"></i><span>豪华车手</span><em>328 潮票</em>
            </button>
          </div>
        </section>
      </aside>
      <div class="launch">
        <button class="launch-extra" data-start="ferry">
          <i data-icon="ferry"></i><span><b>广礐轮渡</b><small>一湾两岸</small></span>
        </button>
        <button id="free-start" class="launch-main" data-start="free">
          <i data-icon="gamepad"></i><span><b>开始自由模式</b><small>进入S城</small></span
          ><span class="launch-arrow">»</span>
        </button>
        <button class="launch-mission" data-open="tasks">
          <i data-icon="flag"></i><span><b>剧情模式</b><small>夜班急件</small></span>
        </button>
      </div>
      <footer class="dock">
        <button class="selected" data-open="home"><i data-icon="home"></i> 首页</button>
        <button data-start="chase"><i data-icon="key"></i> 街头追逐</button>
        <button data-open="tasks"><i data-icon="flag"></i> 任务</button>
        <button data-open="shop"><i data-icon="bag"></i> 商城</button>
        <button data-open="welfare"><i data-icon="gift"></i> 福利</button>
        <button data-open="districts"><i data-icon="map"></i> 地图</button>
        <button class="dock-more" data-open="more"><i data-icon="menu"></i> 更多</button>
        <button class="broadcast" data-open="notice">
          <b>港务广播</b> <span id="ticker">广礐轮渡往返金平区与濠江区。</span>
        </button>
      </footer>
    </main>
    <section id="play" class="play" aria-label="S城" hidden>
      <canvas id="world" tabindex="0" aria-label="三维游戏画面"></canvas>
      <div class="hud">
        <div class="hud-location">
          <span id="district-mark">02</span>
          <div><strong id="district">维修街</strong><small id="district-area">金平区</small></div>
        </div>
        <div id="objective" class="objective">
          <small id="objective-label">自由模式</small><strong id="objective-title"></strong
          ><span id="objective-detail"></span>
        </div>
        <div class="hud-actions">
          <button type="button" class="square" data-game="map" aria-label="打开地图">
            <i data-icon="map"></i></button
          ><button type="button" class="square" data-game="pause" aria-label="暂停">
            <i data-icon="pause"></i>
          </button>
        </div>
        <div id="wanted" class="wanted" hidden>
          <i data-icon="police"></i>
          <span id="wanted-stars" class="wanted-stars"></span>
          <span id="wanted-status"></span>
        </div>
        <div class="hud-wallet">
          <span
            ><i data-icon="coin"></i><span><b id="wallet-value">0</b> 潮票</span></span
          >
          <span><i data-icon="heart"></i><span id="health-value">100 生命</span></span>
        </div>
        <div class="minimap">
          <canvas id="map-mini" width="176" height="176" aria-label="小地图"></canvas
          ><small>S城地图</small>
        </div>
        <div id="drive-hud" class="drive-hud" hidden>
          <div><strong id="speed">0</strong> <small>KM/H</small></div>
          <b id="gear">N</b><span class="condition"><i id="condition"></i></span
          ><small id="car-label"></small>
          <small class="drive-condition"
            ><i data-icon="wrench"></i><span id="drive-status"></span
          ></small>
        </div>
        <div id="foot-hud" class="foot-hud">
          <div id="vitals" class="vitals"><i></i></div>
          <div class="equipped">
            <i id="weapon-icon" data-icon="fist"></i><b id="weapon-label">徒手</b>
          </div>
          <strong id="ammo"></strong>
        </div>
        <div class="interaction" id="interaction" hidden>
          <button type="button" data-game="use">
            <kbd>E</kbd><i id="interaction-icon" data-icon="car"></i><span></span>
          </button>
        </div>
        <div id="crosshair" class="crosshair" aria-hidden="true" hidden></div>
        <div id="game-gloss" class="game-gloss" aria-hidden="true"></div>
      </div>
      <div id="touch" class="touch" hidden>
        <div id="touch-look" class="touch-look"></div>
        <div id="stick" class="stick"><span></span></div>
        <div class="touch-buttons foot-controls">
          <button data-hold="sprint" aria-label="冲刺">
            <i data-icon="sprint"></i><span>冲刺</span>
          </button>
          <button class="jump-button" data-game="jump" aria-label="跳跃">
            <i data-icon="jump"></i><span>跳跃</span>
          </button>
          <button data-game="switch" aria-label="切换武器">
            <i data-icon="repeat"></i><span>切换</span>
          </button>
          <button data-game="reload" aria-label="装填">
            <i data-icon="magazine"></i><span>装填</span>
          </button>
          <button data-game="aim" aria-label="瞄准"><i data-icon="target"></i><span>瞄准</span></button>
          <button id="touch-attack" class="primary-touch" data-hold="fire" aria-label="攻击">
            <i id="touch-attack-icon" data-icon="fist"></i><span id="touch-attack-label">出拳</span>
          </button>
        </div>
        <div class="touch-buttons car-controls">
          <button id="gear-switch" data-game="gear" aria-label="切换倒挡" aria-pressed="false">
            <i data-icon="reverse"></i><span>D / R</span>
          </button>
          <button data-hold="hand" aria-label="手刹">
            <i data-icon="handbrake"></i><span>手刹</span>
          </button>
          <button data-hold="reverse" aria-label="刹车或倒车">
            <i id="touch-brake-icon" data-icon="brake"></i><span id="touch-brake-label">刹车</span>
          </button>
          <button class="primary-touch" data-hold="gas" aria-label="油门">
            <i data-icon="pedal"></i><span>油门</span>
          </button>
        </div>
      </div>
      <section id="cinematic" class="cinematic" aria-label="过场动画" hidden>
        <div id="cinematic-fade" aria-hidden="true"></div>
        <div class="cinematic-caption" aria-live="polite" aria-atomic="true">
          <p id="cinematic-location"></p>
          <h2 id="cinematic-title"></h2>
          <p id="cinematic-subtitle"></p>
        </div>
        <button id="cinematic-skip" class="action" type="button">
          跳过动画 <kbd>Esc</kbd>
        </button>
      </section>
    </section>
    <dialog id="panel" class="panel" aria-labelledby="panel-title">
      <div class="panel-frame">
        <header>
          <div>
            <p id="panel-kicker">S城</p>
            <h2 id="panel-title"></h2>
          </div>
          <button class="square close" type="button" data-panel-close aria-label="关闭">
            <i data-icon="close"></i>
          </button>
        </header>
        <div id="panel-content" class="panel-content"></div>
      </div>
    </dialog>
    <section id="rotation" class="rotation" hidden aria-labelledby="rotation-title">
      <div class="rotate-glyph"><i data-icon="rotate"></i></div>
      <h2 id="rotation-title">请旋转手机方向游玩</h2>
      <p id="rotation-note">把设备横过来即可进入S城。</p>
    </section>
    <div id="toast" class="toast" role="status" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
